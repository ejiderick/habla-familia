<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Email confirmed · FamilySpeak</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/site.css">
  <script>
    // The confirmation link brings a one-time sign-in code (?code=…). It only
    // works inside the FamilySpeak app on the phone that signed up, so on a
    // phone we hand it to the app; it's never sent anywhere else.
    var params = new URLSearchParams(location.search);
    var code = params.get('code');
    // A password reset link from the app's "Forgot password?" adds ?reset=1
    var reset = params.get('reset') === '1';
    var appLink = code ? 'familyspeak://auth-callback?code=' + encodeURIComponent(code) + (reset ? '&reset=1' : '') : 'familyspeak://';
    var onPhone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    // Keep the code out of the address bar and browser history
    if (location.search || location.hash) history.replaceState(null, '', location.pathname);
  </script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="../"><img src="../assets/logo-full.svg" alt="FamilySpeak" width="193" height="56"></a>
    </div>
  </header>
  <main class="wrap narrow doc" style="text-align:center">
    <h1 id="title">Your email is confirmed</h1>
    <p class="lead" id="lead" style="margin:0 auto 24px">Go back to the FamilySpeak app on your phone and log in.</p>
    <p id="open" hidden><a class="cta" id="open-link" href="familyspeak://">Open FamilySpeak</a></p>
    <div class="card" style="text-align:left">
      <p lang="es"><strong id="es-title">Tu correo está confirmado.</strong> <span id="es">Vuelve a la app FamilySpeak en tu teléfono e inicia sesión.</span></p>
      <p lang="ht" style="margin:0"><strong id="ht-title">Imèl ou konfime.</strong> <span id="ht">Retounen nan app FamilySpeak la sou telefòn ou epi konekte.</span></p>
    </div>
    <p class="soft" style="margin-top:24px">Need help? <a href="mailto:hello@familyspeak.app">hello@familyspeak.app</a></p>
  </main>
  <script>
    // A password reset link (from "Forgot password?" in the app); es/ht reviewed (batch 7)
    if (reset) {
      document.title = 'New password · FamilySpeak';
      document.getElementById('title').textContent = 'Choose your new password';
      document.getElementById('lead').textContent = 'Open this link on the phone where you tapped “Forgot password?”.';
      document.getElementById('es-title').textContent = 'Elige tu contraseña nueva.';
      document.getElementById('es').textContent = 'Abre este enlace en el teléfono donde tocaste «¿Olvidaste tu contraseña?».';
      document.getElementById('ht-title').textContent = 'Chwazi nouvo modpas ou.';
      document.getElementById('ht').textContent = 'Louvri lyen sa a sou telefòn kote ou te peze «Ou bliye modpas ou?» la.';
    }
    // On a phone: a button too, in case the automatic switch to the app was blocked
    if (code && onPhone) {
      document.getElementById('lead').textContent = 'Opening FamilySpeak… If nothing happens, tap the button.';
      document.getElementById('es').textContent = 'Abriendo FamilySpeak… Si no se abre, toca el botón.';
      document.getElementById('ht').textContent = 'N ap louvri FamilySpeak… Si li pa louvri, peze bouton an.';
      document.getElementById('open-link').href = appLink;
      document.getElementById('open').hidden = false;
      // Open the app once the page (and its button) is showing, so a cancelled switch still leaves the button
      setTimeout(function () { location.href = appLink; }, 400);
    }
  </script>
</body>
</html>
