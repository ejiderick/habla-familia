<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Habla · Voces de la familia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF7E6; --surface: #FFFFFF; --border: #F0E2C4;
      --text: #2B2D42; --soft: #6B6F80;
      --coral: #FF6B4A; --coral-dark: #D9502F; --teal: #2EC4B6; --teal-dark: #1F9A8F;
      --sun: #FFC93C; --sun-soft: #FFF2C2; --leaf: #34C759; --leaf-soft: #E3F9E9;
      --danger: #E5484D; --info-soft: #E6F0FF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 600 18px/1.45 Nunito, -apple-system, system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
    h1, h2 { font-family: Fredoka, sans-serif; margin: 0; line-height: 1.2; }
    h1 { font-size: 30px; }
    h2 { font-size: 22px; margin-top: 28px; }
    .brand { font: 700 28px Fredoka, sans-serif; color: var(--coral); }
    .soft { color: var(--soft); }
    .card {
      background: var(--surface); border: 2px solid var(--border); border-bottom-width: 4px;
      border-radius: 20px; padding: 16px; margin-top: 12px;
    }
    .card.done { border-color: var(--leaf); background: var(--leaf-soft); }
    .who { font-size: 14px; color: var(--soft); }
    .line { font: 600 24px/1.3 Fredoka, sans-serif; margin: 4px 0 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button {
      font: 700 18px Fredoka, sans-serif; border: 0; border-radius: 999px; cursor: pointer;
      padding: 12px 18px; min-height: 48px; color: #fff; background: var(--coral);
      border-bottom: 4px solid var(--coral-dark);
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; }
    button.teal { background: var(--teal); border-bottom-color: var(--teal-dark); }
    button.plain { background: var(--surface); color: var(--text); border: 2px solid var(--border); border-bottom-width: 4px; }
    button.recording { background: var(--danger); border-bottom-color: #B3262B; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { transform: scale(1.04); } }
    .timer { font: 700 18px Fredoka, sans-serif; color: var(--danger); }
    .tip { background: var(--sun-soft); border-radius: 16px; padding: 12px 14px; margin-top: 16px; }
    .reply { background: var(--info-soft); border-radius: 16px; padding: 12px; margin-top: 10px; }
    .reply audio { width: 100%; margin-top: 6px; }
    .badge { display: inline-block; font-size: 14px; padding: 2px 10px; border-radius: 999px; background: var(--leaf); color: #fff; }
    .center { text-align: center; padding-top: 40px; }
    .big { font-size: 64px; }
    .error { color: var(--danger); font-size: 16px; margin-top: 8px; }
    audio { max-width: 100%; }
  </style>
</head>
<body>
<main id="app">
  <div class="center"><div class="big">🎙️</div><p class="soft">Cargando…</p></div>
</main>

<script>
// Habla family voice page. Source: habla-app/web/familia/index.html
// The secret part of the link (#t=…) never leaves this page except to the Habla server.
const FUNCTION_URL = 'https://ddqowqcenlcjeyzpfoza.supabase.co/functions/v1/family';
const MAX_SECONDS = 15;

const app = document.getElementById('app');
const token = new URLSearchParams(location.hash.slice(1)).get('t') || '';
let data = null;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

async function call(body) {
  const res = await fetch(FUNCTION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, ...body }),
  });
  if (res.status === 404) throw new Error('link');
  if (!res.ok) throw new Error('server');
  return res.json();
}

function showMessage(emoji, title, body) {
  app.innerHTML = `<div class="center"><div class="big">${emoji}</div><h1>${esc(title)}</h1><p class="soft">${esc(body)}</p></div>`;
}

async function load() {
  if (!token) return showMessage('🔗', 'Falta el enlace', 'Abre el enlace completo que te mandó la familia.');
  try {
    data = await call({ action: 'open' });
    render();
  } catch (e) {
    if (e.message === 'link') showMessage('🔒', 'Este enlace ya no funciona', 'Pídele a la familia un enlace nuevo.');
    else showMessage('📶', 'No pudimos conectarnos', 'Revisa tu internet y vuelve a abrir el enlace.');
  }
}

function render() {
  const kid = esc(data.kid.nickname);
  const todo = data.phrases.filter((p) => !p.recorded).length;
  app.innerHTML = `
    <div class="brand">¡Habla!</div>
    <h1>¡Hola, ${esc(data.link.name)}! 💛</h1>
    <p>Graba tu voz para <b>${kid}</b>. Cuando ${kid} practique español en la app, va a escuchar <b>tu voz</b> en estas frases.</p>
    <div class="tip">👉 Toca <b>Grabar</b>, di la frase con cariño, como se la dirías a ${kid}, y toca <b>Parar</b>. Puedes escucharla antes de guardarla.</div>
    ${data.replies.length ? `<h2>💌 Mensajes de ${kid}</h2>${data.replies.map(replyCard).join('')}` : ''}
    <h2>🎙️ Frases para grabar ${todo ? `<span class="soft">(${todo})</span>` : ''}</h2>
    ${data.phrases.length ? data.phrases.map(phraseCard).join('') : `<p class="soft">Por ahora no hay frases. ¡Vuelve pronto!</p>`}
    <p class="soft" style="font-size:14px;margin-top:32px">Solo la familia de ${kid} tiene este enlace. Las grabaciones son privadas.</p>`;
  data.phrases.forEach((p, i) => wirePhrase(p, i));
  app.querySelectorAll('audio[data-reply]').forEach((el) => {
    el.addEventListener('play', () => call({ action: 'heard', replyId: el.dataset.reply }).catch(() => {}), { once: true });
  });
}

function replyCard(r) {
  const when = new Date(r.createdAt).toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
  return `<div class="reply">${r.heard ? '' : '<span class="badge">¡Nuevo!</span> '}<span class="soft">${esc(when)}</span>
    ${r.url ? `<audio controls preload="none" src="${esc(r.url)}" data-reply="${esc(r.id)}"></audio>` : ''}</div>`;
}

function phraseCard(p, i) {
  return `<div class="card ${p.recorded ? 'done' : ''}" id="p${i}">
    <div class="who">${esc(speakerLabel(p.speaker))} ${p.recorded ? '· <b style="color:var(--leaf)">✅ Grabada</b>' : ''}</div>
    <div class="line">${esc(p.text)}</div>
    <div class="row" data-controls></div>
    <div class="error" data-error></div>
  </div>`;
}

function speakerLabel(s) {
  return { 'Abuela': '👵 La dice Abuela', 'Abuelo': '👴 La dice Abuelo', 'Mamá': '👩 La dice Mamá', 'Papá': '👨 La dice Papá', 'Tía': '👩 La dice la tía', 'Tío': '👨 La dice el tío' }[s] || '';
}

// Each phrase: idle → recording → review (listen, save, redo) → saved
function wirePhrase(p, i) {
  const card = document.getElementById('p' + i);
  const controls = card.querySelector('[data-controls]');
  const error = card.querySelector('[data-error]');
  let recorder = null, chunks = [], blob = null, timer = null, stream = null;

  const idle = () => {
    controls.innerHTML = p.recorded
      ? `<button class="plain" data-act="record">🔁 Grabar otra vez</button><button class="plain" data-act="delete">🗑️ Borrar</button>`
      : `<button data-act="record">🎙️ Grabar</button>`;
  };
  const stopTracks = () => stream && stream.getTracks().forEach((t) => t.stop());

  const start = async () => {
    error.textContent = '';
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      error.textContent = 'Necesitamos el micrófono. Permite el micrófono para esta página e inténtalo otra vez.';
      return;
    }
    const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    chunks = [];
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      stopTracks();
      clearInterval(timer);
      blob = new Blob(chunks, { type: recorder.mimeType || type || 'audio/mp4' });
      review();
    };
    recorder.start();
    let left = MAX_SECONDS;
    controls.innerHTML = `<button class="recording" data-act="stop">⏹️ Parar</button><span class="timer">${left}</span>`;
    timer = setInterval(() => {
      left -= 1;
      const t = controls.querySelector('.timer');
      if (t) t.textContent = left;
      if (left <= 0) recorder.state === 'recording' && recorder.stop();
    }, 1000);
  };

  const review = () => {
    const url = URL.createObjectURL(blob);
    controls.innerHTML = `<audio controls src="${url}"></audio>
      <button class="teal" data-act="save">✅ Guardar</button><button class="plain" data-act="record">🔁 Otra vez</button>`;
  };

  const save = async (btn) => {
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    error.textContent = '';
    const form = new FormData();
    form.append('action', 'record');
    form.append('token', token);
    form.append('stepId', p.stepId);
    form.append('audio', blob, 'voz.' + (blob.type.includes('webm') ? 'webm' : 'm4a'));
    try {
      const res = await fetch(FUNCTION_URL, { method: 'POST', body: form });
      if (res.status === 404) return showMessage('🔒', 'Este enlace ya no funciona', 'Pídele a la familia un enlace nuevo.');
      if (!res.ok) throw new Error();
      p.recorded = true;
      card.classList.add('done');
      card.querySelector('.who').innerHTML = `${esc(speakerLabel(p.speaker))} · <b style="color:var(--leaf)">✅ ¡Guardada! Gracias</b>`;
      idle();
    } catch {
      btn.disabled = false;
      btn.textContent = '✅ Guardar';
      error.textContent = 'No se pudo guardar. Revisa tu internet e inténtalo otra vez.';
    }
  };

  const remove = async (btn) => {
    btn.disabled = true;
    try {
      await call({ action: 'unrecord', stepId: p.stepId });
      p.recorded = false;
      card.classList.remove('done');
      card.querySelector('.who').textContent = speakerLabel(p.speaker);
      idle();
    } catch {
      btn.disabled = false;
      error.textContent = 'No se pudo borrar. Inténtalo otra vez.';
    }
  };

  controls.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'record') start();
    else if (act === 'stop') recorder && recorder.state === 'recording' && recorder.stop();
    else if (act === 'save') save(btn);
    else if (act === 'delete') remove(btn);
  });
  idle();
}

window.addEventListener('hashchange', load);
load();
</script>
</body>
</html>
