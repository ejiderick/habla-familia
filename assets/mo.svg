<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 0 112 116" role="img" aria-label="Mo, the FamilySpeak buddy, waving">
  <!-- Mo (BRAND.md "The buddy"): same shapes as src/components/buddy.tsx, waving -->
  <!-- Sound-wave tufts -->
  <g fill="none" stroke="#D6336F" stroke-width="4.2" stroke-linecap="round">
    <path d="M42 29 q-6 -8 0 -16" transform="rotate(-16 42 29)"/>
    <path d="M50 29 q-6 -10 0 -20"/>
    <path d="M58 29 q-6 -8 0 -16" transform="rotate(16 58 29)"/>
  </g>
  <!-- Feet -->
  <rect x="26" y="100" width="20" height="12" rx="6" fill="#E89A00"/>
  <rect x="54" y="100" width="20" height="12" rx="6" fill="#E89A00"/>
  <!-- Arms: left hanging, right waving -->
  <rect x="-6" y="0" width="12" height="20" rx="6" fill="#FFB21A" stroke="#E89A00" stroke-width="1.2" transform="translate(16 62) rotate(22)"/>
  <rect x="-6" y="0" width="12" height="20" rx="6" fill="#FFB21A" stroke="#E89A00" stroke-width="1.2" transform="translate(84 62) rotate(-150)"/>
  <!-- Body and belly -->
  <rect x="12" y="24" width="76" height="84" rx="38" fill="#FFB21A"/>
  <rect x="28" y="72" width="44" height="32" rx="16" fill="#FFD27A"/>
  <!-- Cheeks -->
  <ellipse cx="25" cy="66.8" rx="5" ry="2.8" fill="#F7A1BD"/>
  <ellipse cx="75" cy="66.8" rx="5" ry="2.8" fill="#F7A1BD"/>
  <!-- Eyebrows -->
  <rect x="33" y="36.5" width="10" height="2.8" rx="1.4" fill="#24132E"/>
  <rect x="57" y="36.5" width="10" height="2.8" rx="1.4" fill="#24132E"/>
  <!-- Eyes with white highlights -->
  <ellipse cx="38" cy="53" rx="6.5" ry="9" fill="#24132E"/>
  <ellipse cx="62" cy="53" rx="6.5" ry="9" fill="#24132E"/>
  <circle cx="36" cy="49" r="2.5" fill="#fff"/>
  <circle cx="60" cy="49" r="2.5" fill="#fff"/>
  <circle cx="41" cy="57.8" r="1.2" fill="#fff"/>
  <circle cx="65" cy="57.8" r="1.2" fill="#fff"/>
  <!-- Small open smile -->
  <path d="M43.5 66 h13 a6.5 7 0 0 1 -13 0 z" fill="#24132E"/>
</svg>
